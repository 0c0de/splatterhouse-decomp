# Splatterhouse (2010) - Xbox 360 - Config de codegen para ReXGlue
# Referencia: https://github.com/rexglue/rexglue-sdk/wiki/rexglue-CLI-Configuration-File
#
# Migrado desde config/recomp.toml (XenonRecomp). Las claves de flags son
# equivalentes 1:1 en ReXGlue.
#
# Uso (vía manifest): rexglue codegen splatterhouse_manifest.toml

# ============================================================
# Optimizaciones de codegen (port desde XenonRecomp recomp.toml)
# Activas para evitar el problema de save/restore functions mal
# recompiladas (fusionadas por fall-through). Con
# non_volatile_as_local, r14-r31 se convierten en variables
# locales y el codegen elimina las llamadas a __savegprlr/__restgprlr.
# ============================================================
skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true

# SEH: UE3 usa __try/__except (proteccion de memoria scrubble etc.).
# Sin esto, las excepciones del guest llegan como access violation del host.
generate_exception_handlers = true

# ============================================================
# Nota de migracion (XenonRecomp -> ReXGlue)
# XenonRecomp usaba claves explícitas para las funciones de
# save/restore de registros detectadas con tools/find_restores.py:
#   restgprlr_14_address  = 0x829B0610
#   savegprlr_14_address  = 0x829B05C0
#   restfpr_14_address    = 0x829B13BC
#   savefpr_14_address    = 0x829B1370
#   restvmx_14_address    = 0x829B1FD8
#   savevmx_14_address    = 0x829B1D40
#   restvmx_64_address    = 0x829B206C
#   savevmx_64_address    = 0x829B1DD4
# ReXGlue no tiene esas claves: el analisis detecta las funciones
# __savegprlr/__restgprlr/__savefpr/__restfpr/__savevmx/__restvmx
# automaticamente. No es necesario configurar nada aqui.
#
# setjmp/longjmp (descomentar si el juego los usa):
#   setjmp_address  = 0x82000000
#   longjmp_address = 0x82000100
# ============================================================

# ============================================================
